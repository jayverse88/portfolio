<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Klaa Raéd</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f6f2ea;--line:#ded5c2;--ink:#1a1713;--dim:#8a8069;--accent:#c65a2e}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    background:
      linear-gradient(#e9e2d3 1px,transparent 1px),
      linear-gradient(90deg,#e9e2d3 1px,transparent 1px),var(--paper);
    background-size:56px 56px,56px 56px,auto;
    color:var(--ink);font-family:'Fraunces',Georgia,serif;text-align:center;padding:24px;
  }
  .box{border:1px solid var(--line);background:#fbf8f2;padding:3.5rem 3rem;max-width:520px}
  .mono{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
  h1{font-size:4.5rem;font-weight:500;line-height:1;margin:.8rem 0 .4rem}
  h1 span{color:var(--accent)}
  p{font-size:1.05rem;color:#5c5443;margin-bottom:1.8rem}
  a{
    display:inline-block;border:1px solid var(--ink);color:var(--ink);
    text-decoration:none;padding:12px 26px;font-family:'JetBrains Mono',monospace;
    font-size:.78rem;letter-spacing:.08em;transition:background .25s,color .25s;
  }
  a:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
  <div class="box">
    <p class="mono">FIG. 404 — PLAN INTROUVABLE</p>
    <h1>404<span>.</span></h1>
    <p>Cette page n'existe pas (ou plus). Le reste du portfolio, lui, fonctionne très bien.</p>
    <a href="/">← RETOUR À L'ACCUEIL</a>
  </div>
</body>
</html>
